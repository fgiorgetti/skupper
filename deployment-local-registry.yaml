apiVersion: apps/v1
kind: Deployment
metadata:
  name: skupper-controller
  namespace: skupper
spec:
  replicas: 1
  selector:
    matchLabels:
      application: skupper-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skupper-controller
        app.kubernetes.io/part-of: skupper
        application: skupper-controller
        skupper.io/component: controller
    spec:
      containers:
        - args:
            - -enable-grants
            - -grant-server-autoconfigure
          command:
            - /app/controller
          env:
            - name: SKUPPER_KUBE_ADAPTOR_IMAGE
              value: 192.168.124.1:5000/kube-adaptor:v2-dev
            - name: SKUPPER_KUBE_ADAPTOR_IMAGE_PULL_POLICY
              value: Always
            - name: SKUPPER_ROUTER_IMAGE
              value: 192.168.124.1:5000/skupper-router:main
            - name: SKUPPER_ROUTER_IMAGE_PULL_POLICY
              value: Always
          image: 192.168.124.1:5000/controller:v2-dev
          imagePullPolicy: Always
          name: controller
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/controller
              name: tls-credentials
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: skupper-controller
      volumes:
        - emptyDir: {}
          name: tls-credentials
