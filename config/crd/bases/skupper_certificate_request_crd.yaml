apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificaterequests.skupper.io
spec:
  group: skupper.io
  versions:
    - name: v2alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: "An internal resource used to request a TLS certificate to be signed by a remote issuer"
          type: object
          properties:
            spec:
              type: object
              properties:
                issuer:
                  type: string
                request:
                  type: string
                secretName:
                  type: string
                settings:
                  type: object
                  additionalProperties:
                    type: string
              required:
              - issuer
              - request
            status:
              type: object
              properties:
                status:
                  type: string
                message:
                  type: string
                caCertificate:
                  type: string
                certificate:
                  type: string
                expiration:
                  type: string
                  format: date-time
                controller:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    version:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        enum:
                        - "True"
                        - "False"
                        - Unknown
                        type: string
                      type:
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                    - lastTransitionTime
                    - message
                    - reason
                    - status
                    - type
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Issuer
        type: string
        description: Identifies the issuer to be used in signing the certificate
        jsonPath: .spec.ca
      - name: Status
        type: string
        description: The status of the certificate
        jsonPath: .status.status
      - name: Expiration
        type: string
        description: The expiration of the certificate if relevant
        jsonPath: .status.expiration
      - name: Message
        type: string
        description: Any relevant human readable message
        jsonPath: .status.message
  scope: Namespaced
  names:
    plural: certificaterequests
    singular: certificaterequest
    kind: CertificateRequest
