apiVersion: v1
kind: Service
metadata:
  name: skupper-runtime-api
  namespace: skupper
  labels:
    app.kubernetes.io/name: skupper-controller
    app.kubernetes.io/part-of: skupper
    application: skupper-controller
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: runtime-api
  selector:
    application: skupper-controller
